<section class="cta-band" aria-labelledby="cta-heading">
  <div class="container cta-band__inner">
    <div class="cta-band__text">
      <h2 class="cta-band__heading" id="cta-heading">{{ heading }}</h2>
      <p class="cta-band__subtext">{{ subtext }}</p>
    </div>
    <div class="cta-band__actions">
      <a *ngIf="btn1Label" [routerLink]="btn1Link" class="btn btn-primary">{{ btn1Label }}</a>
      <a *ngIf="btn2Label" [routerLink]="btn2Link" class="btn btn-outline-white">{{ btn2Label }}</a>
    </div>
  </div>
</section>
